# Free Food London: where a student can get free food near a London area,
# postcode or station. Live lookups only, no API keys, nothing kept.

manifest_version: 1

# Every hackathon app keeps nothing between calls. Do not change it.
persistence: none

# The public name shown with the app: "by freefood". A pseudonym.
app_author_name: "freefood"

app:
  # Fixed by the repository name (Pippa-Labs/pippa-hack-app-eadd).
  id: hack.app_eadd
  name: Free Food London
  version: 0.1.0
  # Never use the word "by" here: the badge splits on it.
  summary: >-
    Finds free food near a London area, postcode or station: community
    fridges, gurdwara langar meals and upcoming in-person London hackathons,
    from OpenStreetMap and Devpost.

agent_types:
  - personal

outcomes:
  - id: freefood.near
    summary: >-
      Free food near a London area, postcode or station: community fridges,
      gurdwara langar and London hackathons
    example_phrases:
      - free food near
      - where can i get free food in
      - community fridge near
      - hackathons with free food in london
      - free meal near
      - langar near
      - free lunch near
      - any free food events in london
    inputs:
      - name: location
        type: string
        required: false
        description: >-
          The London area, postcode or station the user wants free food near,
          as they wrote it, for example "Camden", "E1 6AN", "SE1" or "King's
          Cross station". If the message does not name a place, return an
          empty string. Never guess, and never fill in a place the user did
          not write.
    output:
      - name: places
        type: array
        item_type: string
        description: >-
          Up to 5 free-food places within about 2 km, nearest first, each as
          "name, type, distance in m, opening hours if known, tip".
      - name: events
        type: array
        item_type: string
        description: >-
          Up to 3 upcoming in-person London hackathons from Devpost, each as
          "name, date, location, link".
      - name: sources
        type: string
        description: >-
          Credits for the data (OpenStreetMap contributors, Devpost), and any
          source that could not be reached this time.

# No API keys, no connectors, no secrets: every source is public and keyless.
